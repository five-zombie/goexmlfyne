name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install Fyne system dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev
      - name: Check formatting
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: Regenerate goexml code and reject diffs
        run: |
          go generate ./...
          git diff --exit-code
      - run: go vet ./...
      - run: go build ./...
      - run: go test -count=1 ./...
      - run: go test -race -count=1 ./...
      # The README compile gate is skipped under -short; CI is a full
      # run, but it is listed explicitly so the contract stays visible.
      - name: Compile README examples
        run: go test -count=1 -run TestREADMEExamplesCompile -v ./
